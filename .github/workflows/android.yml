name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK from runner
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)
          fi
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle :app:assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk Ghi-chu-nhanh-v1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ghi-chu-nhanh-v1.0.0-APK
          path: Ghi-chu-nhanh-v1.0.0.apk
          if-no-files-found: error
      - name: Publish APK test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo 'Release already exists; download this build from Artifacts.'
          else
            gh release create v1.0.0 Ghi-chu-nhanh-v1.0.0.apk --target "$GITHUB_SHA" --title "Ghi chú nhanh v1.0.0" --notes "APK thử nghiệm, ký debug. Android 8+. Widget 2×2." --prerelease
          fi
